
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Digital Attendance System</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>

    <main class="login-page">

        <!-- LEFT SIDE -->
        <section class="login-left">

            <div class="brand-icon">
                <svg viewBox="0 0 100 100" width="90" height="90"
                     fill="none" stroke="currentColor" stroke-width="6">
                    <rect x="15" y="20" width="70" height="65" rx="10"/>
                    <path d="M30 10V30 M70 10V30"/>
                    <path d="M30 45H70 M30 58H55"/>
                    <circle cx="68" cy="70" r="18" fill="#ffffff"/>
                    <path d="M58 70L65 77L79 62"
                          stroke="#0874f9" stroke-width="5"/>
                </svg>
            </div>

            <h1>Digital<br>Attendance System</h1>

            <p class="tagline">Track. Manage. Monitor.</p>

        </section>

        <!-- RIGHT SIDE -->
        <section class="login-right">

            <div class="login-card">

                <div class="login-logo">
                    <svg viewBox="0 0 100 100" width="70" height="70"
                         fill="none" stroke="#0874f9" stroke-width="5">
                        <path d="M50 10L85 25V55C85 75 65 88 50 95
                                 C35 88 15 75 15 55V25Z"
                              fill="#0874f9"/>
                        <rect x="35" y="45" width="30" height="25"
                              rx="5" stroke="white"/>
                        <path d="M40 45V35A10 10 0 0 1 60 35V45"
                              stroke="white"/>
                    </svg>
                </div>

                <h2>Admin Login</h2>
                <p class="login-subtitle">
                    Sign in to access the dashboard
                </p>

                <form id="adminLoginForm">

                    <div class="input-group">
                        <span class="input-icon">👤</span>

                        <input
                            type="text"
                            id="adminUsername"
                            name="username"
                            placeholder="Admin Username"
                            autocomplete="username"
                            required>
                    </div>

                    <div class="input-group">
                        <span class="input-icon">🔒</span>

                        <input
                            type="password"
                            id="adminPassword"
                            name="password"
                            placeholder="Admin Password"
                            autocomplete="current-password"
                            required>

                        <button
                            type="button"
                            class="password-toggle"
                            id="togglePassword"
                            aria-label="Show password">
                            👁
                        </button>
                    </div>

                    <div class="forgot-password">
                        <a href="login.html">Forgot Password?</a>
                    </div>

                    <button type="submit" class="login-button">
                        <span>⇥</span>
                        LOG IN
                    </button>

                    <div id="loginMessage"
                         class="message"
                         role="status"
                         aria-live="polite">
                    </div>

                </form>

            </div>

        </section>

    </main>

    <footer>
        © 2026 Digital Attendance System
    </footer>

    <script src="app.js"></script>

</body>
</html>
