
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="theme-color" content="#172554">
    <title>Digital Attendance System</title>

    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            background: linear-gradient(135deg, #0f172a, #1e3a8a, #2563eb);
            font-family: Arial, Helvetica, sans-serif;
            color: white;
        }

        .loading-container {
            text-align: center;
            padding: 30px;
        }

        .brand-icon {
            width: 76px;
            height: 76px;
            margin: 0 auto 24px;
            display: flex;
            align-items: center;
            justify-content: center;
            border-radius: 22px;
            background: white;
            color: #1e40af;
            font-size: 28px;
            font-weight: 800;
            box-shadow: 0 10px 30px rgba(0, 0, 0, 0.2);
        }

        h1 {
            font-size: clamp(25px, 5vw, 40px);
            font-weight: 800;
            margin-bottom: 12px;
            letter-spacing: -1px;
        }

        p {
            color: #dbeafe;
            font-size: 15px;
            letter-spacing: 2px;
        }

        .loader {
            width: 36px;
            height: 36px;
            margin: 35px auto 0;
            border: 4px solid rgba(255, 255, 255, 0.25);
            border-top-color: white;
            border-radius: 50%;
            animation: spin 0.8s linear infinite;
        }

        @keyframes spin {
            to {
                transform: rotate(360deg);
            }
        }
    </style>
</head>

<body>

    <main class="loading-container">
        <div class="brand-icon">DA</div>

        <h1>Digital Attendance System</h1>
        <p>TRACK. MANAGE. MONITOR.</p>

        <div class="loader"></div>
    </main>

    <script>
        window.location.replace("login.html");
    </script>

</body>
</html>
